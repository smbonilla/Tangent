[project]
name = "prompt-lab"
version = "0.1.0"
description = "Run Tangent's production prompts locally with Ollama"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
run-prompts = "prompt_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
